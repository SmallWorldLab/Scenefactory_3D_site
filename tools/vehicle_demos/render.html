<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Vehicle demo renderer</title>
<style>
  html, body { margin: 0; background: #dfe6e4; overflow: hidden; font-family: "Inter", "Helvetica Neue", Arial, sans-serif; }
  canvas { display: block; }
  .tag { position: absolute; transform: translate(-50%, -100%); padding: 5px 10px 6px; border-radius: 7px;
         background: rgba(18, 28, 26, 0.82); color: #fff; font-size: 17px; line-height: 1.15; white-space: nowrap; }
  .tag b { font-weight: 600; }
  .tag span { display: block; font-size: 15px; color: #a9e3d6; font-variant-numeric: tabular-nums; }
  .tag span:empty { display: none; }
  .tag::after { content: ""; position: absolute; left: 50%; bottom: -6px; margin-left: -6px;
                border: 6px solid transparent; border-bottom: 0; border-top-color: rgba(18, 28, 26, 0.82); }
  #clock, #brand { position: absolute; bottom: 14px; padding: 4px 10px; border-radius: 6px; font-size: 16px;
                   background: rgba(245, 248, 247, 0.85); color: #1d2b28; font-variant-numeric: tabular-nums; }
  #clock { right: 18px; } #brand { left: 18px; }
</style>
</head>
<body>
<div id="clock"></div>
<div id="brand">SceneFactory-3D vehicle model</div>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }</script>
<script type="module">
import * as THREE from "three";

const W = innerWidth, H = innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdfe6e4);
scene.fog = new THREE.Fog(0xdfe6e4, 140, 420);
const camera = new THREE.PerspectiveCamera(38, W / H, 0.05, 1500);
camera.up.set(0, 0, 1);
scene.add(new THREE.HemisphereLight(0xf2f6ff, 0x5a5448, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
sun.shadow.bias = -0.0004;
scene.add(sun, sun.target);

let D, vehicles = [], tags = [], groupTags = [], beacons = [];

function laneBounds(lanes) {
  const ys = lanes.map(l => l.y).sort((a, b) => a - b);
  if (!ys.length) return [];
  const half = i => (ys.length > 1 ? (i + 1 < ys.length ? ys[i + 1] - ys[i] : ys[i] - ys[i - 1]) / 2 : 1.8);
  const out = [ys[0] - (ys.length > 1 ? (ys[1] - ys[0]) / 2 : 1.8)];
  ys.forEach((y, i) => out.push(i + 1 < ys.length ? (y + ys[i + 1]) / 2 : y + half(i)));
  return out;
}

function terrainTexture(T) {
  // Paint asphalt, low-friction patches, sidewalks, lane lines and markers.
  const wM = (T.nx - 1) * T.spacing, hM = (T.ny - 1) * T.spacing;
  const ppm = Math.min(32, 8192 / Math.max(wM, hM));
  const cv = document.createElement("canvas");
  cv.width = Math.round(wM * ppm); cv.height = Math.round(hM * ppm);
  const sx = cv.width / wM, sy = cv.height / hM;
  const g = cv.getContext("2d");
  const px = x => (x - T.x0) * sx, py = y => cv.height - (y - T.y0) * sy;
  g.fillStyle = "#8f9a8f"; g.fillRect(0, 0, cv.width, cv.height);           // verge
  let rnd = 7; const rand = () => (rnd = (rnd * 16807) % 2147483647) / 2147483647;
  const speckle = (x, y, w, h, ice) => {
    const n = Math.min(4e6, Math.round(w * h / (ice ? 90 : 14)));
    for (let i = 0; i < n; i++) {
      g.fillStyle = ice ? `rgba(255,255,255,${0.3 + 0.5 * rand()})` : `rgba(${rand() < 0.5 ? "30,33,36" : "105,110,113"},0.22)`;
      g.fillRect(x + rand() * w, y + rand() * h, ice ? 4 : 1, ice ? 2 : 1);
    }
  };
  if (D.shoulder !== undefined) {                                           // paved shoulder
    g.fillStyle = "#6b7176"; g.fillRect(0, py(D.shoulder), cv.width, py(D.shoulder - 3.6) - py(D.shoulder));
  }
  for (const s of T.surfaces) {
    const ice = s.mu < 0.5;
    g.save();
    g.translate(px(s.x), py(s.y)); g.rotate(-(s.angle || 0));
    const w = (s.w || 2 * s.r) * sx, h = (s.h || 2 * s.r) * sy;
    g.fillStyle = ice ? "#d4e6ef" : "#4a4f53";
    if (s.shape === "disc") { g.beginPath(); g.arc(0, 0, s.r * sx, 0, 7); g.fill(); } else g.fillRect(-w / 2, -h / 2, w, h);
    speckle(-w / 2, -h / 2, w, h, ice);
    if (ice) { g.strokeStyle = "rgba(60,120,150,0.55)"; g.lineWidth = 3; g.strokeRect(-w / 2, -h / 2, w, h); }
    g.restore();
  }
  if (D.sidewalk) {                                                         // concrete slabs
    const y0 = py(T.y0 + hM), y1 = py(D.sidewalk.y);
    g.fillStyle = "#bfc2bd"; g.fillRect(0, y0, cv.width, y1 - y0);
    g.strokeStyle = "rgba(90,92,88,0.45)"; g.lineWidth = Math.max(1, 0.03 * sx);
    for (let x = Math.ceil(T.x0 / 1.5) * 1.5; x < T.x0 + wM; x += 1.5) { g.beginPath(); g.moveTo(px(x), y0); g.lineTo(px(x), y1); g.stroke(); }
    for (let y = D.sidewalk.y; y < T.y0 + hM; y += 1.5) { g.beginPath(); g.moveTo(0, py(y)); g.lineTo(cv.width, py(y)); g.stroke(); }
    g.fillStyle = "#9ea19c"; g.fillRect(0, y1 - 0.15 * sy, cv.width, 0.15 * sy);   // curb face
  }
  const bounds = laneBounds(D.lanes || []);
  g.strokeStyle = "rgba(255,255,255,0.9)";
  bounds.forEach((y, i) => {
    g.lineWidth = 0.15 * sy;
    g.setLineDash(i === 0 || i === bounds.length - 1 ? [] : [3 * sx, 6 * sx]);
    g.beginPath(); g.moveTo(0, py(y)); g.lineTo(cv.width, py(y)); g.stroke();
  });
  g.setLineDash([]);
  for (const m of D.markers || []) {
    g.strokeStyle = "rgba(240,180,40,0.95)"; g.lineWidth = 0.5 * sx;
    g.beginPath(); g.moveTo(px(m.x), py(bounds[0])); g.lineTo(px(m.x), py(bounds[bounds.length - 1])); g.stroke();
  }
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}

function buildTerrain(T) {
  const geo = new THREE.BufferGeometry();
  const n = T.nx * T.ny, pos = new Float32Array(n * 3), uv = new Float32Array(n * 2);
  for (let j = 0; j < T.ny; j++) for (let i = 0; i < T.nx; i++) {
    const k = j * T.nx + i;
    pos.set([T.x0 + i * T.spacing, T.y0 + j * T.spacing, T.z[k]], 3 * k);
    uv.set([i / (T.nx - 1), j / (T.ny - 1)], 2 * k);
  }
  const idx = [];
  for (let j = 0; j < T.ny - 1; j++) for (let i = 0; i < T.nx - 1; i++) {
    const a = j * T.nx + i;                       // same diagonal as the physics mesh
    idx.push(a, a + 1, a + T.nx + 1, a, a + T.nx + 1, a + T.nx);
  }
  geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  geo.setAttribute("uv", new THREE.BufferAttribute(uv, 2));
  geo.setIndex(idx); geo.computeVertexNormals();
  const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ map: terrainTexture(T), roughness: 0.92 }));
  mesh.receiveShadow = true;
  scene.add(mesh);
}

const mats = new Map();
function material(color, role) {
  const key = color.join() + role;
  if (!mats.has(key)) {
    const c = new THREE.Color(...color), opt = { color: c, roughness: 0.45, metalness: 0.15 };
    if (role === "glass") Object.assign(opt, { roughness: 0.12, metalness: 0.5 });
    if (role === "beacon" || role.startsWith("lamp")) Object.assign(opt, { emissive: c, emissiveIntensity: 0.9 });
    mats.set(key, new THREE.MeshStandardMaterial(opt));
  }
  return mats.get(key);
}

function shapeMesh(s) {
  let geo;
  const [a, b, c] = s.size;
  if (s.kind === "box") geo = new THREE.BoxGeometry(a, b, c);
  else {
    geo = s.kind === "cone" ? new THREE.ConeGeometry(a, c, 40) : new THREE.CylinderGeometry(a, a, c, 32);
    geo.rotateX(Math.PI / 2);                     // three's +y axis -> body +z
  }
  const mat = s.role === "beacon" ? material(s.color, "beacon").clone() : material(s.color, s.role);
  const m = new THREE.Mesh(geo, mat);
  m.position.set(...s.center); m.castShadow = true;
  if (s.role === "beacon") beacons.push(m);
  return m;
}

const tyreMat = new THREE.MeshStandardMaterial({ color: 0x1b2024, roughness: 0.6 });
const rimMat = new THREE.MeshStandardMaterial({ color: 0xc9ced1, metalness: 0.7, roughness: 0.3 });
const hubMat = new THREE.MeshStandardMaterial({ color: 0x5c6468 });
function wheelMesh(w) {
  const r = w.radius, width = w.dual ? 0.27 : Math.min(0.32, Math.max(0.035, 0.55 * r));
  const spin = new THREE.Group();
  for (const off of w.dual ? [-0.16, 0.16] : [0]) {
    const tyre = new THREE.Mesh(new THREE.CylinderGeometry(r, r, width, 32), tyreMat);
    tyre.position.y = off; tyre.castShadow = true; spin.add(tyre);
    const rim = new THREE.Mesh(new THREE.CylinderGeometry(r * 0.62, r * 0.62, width * 1.04, 8), rimMat);
    rim.position.y = off; spin.add(rim);
  }
  const spoke = new THREE.Mesh(new THREE.BoxGeometry(r * 1.5, (w.dual ? 0.6 : width) * 1.06, Math.max(0.01, r * 0.2)), hubMat);
  spin.add(spoke);
  return spin;
}

function buildVehicle(model) {
  const bodies = model.bodies.map(B => {
    const root = new THREE.Group();
    B.shapes.forEach(s => root.add(shapeMesh(s)));
    const wheels = B.wheels.map(w => {
      const hub = new THREE.Group(); hub.position.set(...w.anchor); root.add(hub);
      const spin = wheelMesh(w); hub.add(spin);
      return { hub, spin, anchor: w.anchor };
    });
    scene.add(root);
    return { root, wheels };
  });
  if (model.kind === "car") {                     // head and tail lamps on the chassis box
    const [L, Wd, bh] = model.bodies[0].shapes[0].size, root = bodies[0].root;
    for (const s of [1, -1]) for (const [c, x] of [[0xfff6d8, L / 2 + 0.01], [0xd8202a, -L / 2 - 0.01]]) {
      const m = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.32, 0.1), new THREE.MeshStandardMaterial({ color: c, emissive: c, emissiveIntensity: 0.9 }));
      m.position.set(x, s * Wd * 0.33, bh * 0.2); root.add(m);
    }
  }
  return { bodies, model };
}

function pose(V, f) {
  let k = 0;
  V.bodies.forEach((B, bi) => {
    const [x, y, z, qx, qy, qz, qw] = f.b[bi];
    B.root.position.set(x, y, z);
    B.root.quaternion.set(qx, qy, qz, qw);
    B.wheels.forEach(w => {
      w.hub.position.set(w.anchor[0], w.anchor[1], w.anchor[2] - f.susp[k]);
      w.hub.rotation.set(0, 0, f.steer[k]);
      w.spin.rotation.set(0, f.spin[k], 0);
      k++;
    });
  });
}

const smooth = { pos: null, look: null };
function vehiclePoints(f) { return f.v.flatMap(v => v.b.map(b => new THREE.Vector3(b[0], b[1], b[2]))); }

function placeCamera(f, dt) {
  const C = D.camera;
  let pos, look;
  if (C.mode === "fixed") {
    pos = new THREE.Vector3(...C.pos); look = new THREE.Vector3(...C.look);
  } else if (C.mode === "fit") {
    // Fit every body (plus margin) in a fixed rear-left-above view direction.
    const box = new THREE.Box3().setFromPoints(vehiclePoints(f)).expandByScalar(C.margin || 5);
    look = box.getCenter(new THREE.Vector3()); look.z = 0;
    const r = 0.5 * Math.hypot(box.max.x - box.min.x, box.max.y - box.min.y);
    const dist = Math.max(r / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)), C.min_dist || 45);
    pos = look.clone().add(new THREE.Vector3(-0.62, -0.42, 0.66).normalize().multiplyScalar(dist));
  } else {
    // Chase that widens with the gap between vehicles, so all stay in frame.
    const ps = f.v.map(v => new THREE.Vector3(...v.b[0].slice(0, 3)));
    const mean = ps.reduce((a, b) => a.add(b), new THREE.Vector3()).multiplyScalar(1 / ps.length);
    const sep = Math.max(...ps.map(p => p.x)) - Math.min(...ps.map(p => p.x));
    const [ox, oy, oz] = C.offset || [-9, -15, 4.5];
    look = mean.clone().add(new THREE.Vector3(2, 0, 0.4));
    if (C.look_ahead !== undefined) {             // look ahead along the lead vehicle's heading
      const q = f.v[0].b[0]; const h = Math.atan2(2 * (q[6] * q[5] + q[3] * q[4]), 1 - 2 * (q[4] * q[4] + q[5] * q[5]));
      look = mean.clone().add(new THREE.Vector3(Math.cos(h) * C.look_ahead, Math.sin(h) * C.look_ahead, 0.25));
    }
    pos = mean.clone().add(new THREE.Vector3(ox - 0.15 * sep, oy - 0.75 * sep, oz + 0.2 * sep));
  }
  if (!smooth.pos || dt === 0) { smooth.pos = pos; smooth.look = look; }
  const a = 1 - Math.exp(-dt / (C.lag || 0.6));
  smooth.pos.lerp(pos, a); smooth.look.lerp(look, a);
  camera.position.copy(smooth.pos); camera.lookAt(smooth.look);
  const reach = camera.position.distanceTo(smooth.look);
  sun.position.copy(smooth.look).add(new THREE.Vector3(-30, -40, 70)); sun.target.position.copy(smooth.look);
  const sc = sun.shadow.camera, r = Math.min(Math.max(reach * 1.2, 8), 120);
  sc.left = -r; sc.right = r; sc.top = r; sc.bottom = -r; sc.far = 300; sc.updateProjectionMatrix();
}

function tagAt(el, p, lift) {
  const v = p.clone().add(new THREE.Vector3(0, 0, lift)).project(camera);
  el.style.left = `${(v.x + 1) / 2 * W}px`; el.style.top = `${(1 - v.y) / 2 * H}px`;
}

function topOf(i) {
  const shapes = D.models[i].bodies[0].shapes;
  return Math.max(...shapes.map(s => s.center[2] + s.size[2] / 2)) + 0.3;
}

function label(f) {
  f.v.forEach((v, i) => {
    const el = tags[i];
    if (!el) return;
    tagAt(el, new THREE.Vector3(...v.b[0].slice(0, 3)), topOf(i));
    let txt = "";
    if (D.show_speed !== false) txt = `${Math.max(0, v.kmh).toFixed(D.show_speed ? 1 : 0).padStart(2, " ")} km/h`;
    if (D.show_wheel_speed) {                     // driven-wheel surface speed reveals wheelspin
      const m = D.models[i], driven = m.name.includes("Crossover") ? [0, 1, 2, 3] : [2, 3];
      const r = m.bodies[0].wheels[0].radius;
      const ws = driven.reduce((a, j) => a + v.omega[j], 0) / driven.length * r * 3.6;
      txt += ` · wheels ${Math.max(0, ws).toFixed(0)} km/h`;
    }
    el.querySelector("span").textContent = txt;
  });
  (D.group_labels || []).forEach((g, gi) => {
    const ps = g.vehicles.map(i => new THREE.Vector3(...f.v[i].b[0].slice(0, 3)));
    const c = ps.reduce((a, b) => a.add(b), new THREE.Vector3()).multiplyScalar(1 / ps.length);
    tagAt(groupTags[gi], c, 1.6);
  });
}

let last = null;
window.__demo = {
  load(data) {
    D = data;
    buildTerrain(D.terrain);
    vehicles = D.models.map(buildVehicle);
    const mk = text => { const el = document.createElement("div"); el.className = "tag"; el.innerHTML = `<b>${text}</b><span></span>`; document.body.appendChild(el); return el; };
    tags = D.labels.map(t => (t ? mk(t) : null));
    groupTags = (D.group_labels || []).map(g => mk(g.text));
    return { n: D.frames.length, hz: D.hz };
  },
  frame(k) {
    const f = D.frames[Math.min(k, D.frames.length - 1)];
    f.v.forEach((v, i) => pose(vehicles[i], v));
    beacons.forEach(m => { m.material.emissiveIntensity = Math.sin(f.t * 2 * Math.PI * 1.5) > 0 ? 1.9 : 0.25; });
    placeCamera(f, last === null ? 0 : 1 / D.hz);
    last = k;
    renderer.render(scene, camera);
    label(f);
    document.getElementById("clock").textContent = `t = ${f.t.toFixed(1)} s`;
  },
};
window.__ready = true;
</script>
</body>
</html>
